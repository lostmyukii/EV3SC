name: Windows Internal Release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/native-adapter-process
    paths:
      - ".github/workflows/windows-internal-release.yml"
      - "package.json"
      - "scripts/run_internal_release_flow.js"
      - "desktop/**"
      - "weisile-link/**"
      - "tests/test_internal_release_flow.py"

jobs:
  windows-internal-release:
    name: Build unsigned Windows internal artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e ./weisile-link pyinstaller pytest

      - name: Verify internal release workflow contract
        shell: pwsh
        run: .\.venv\Scripts\python -m pytest tests/test_internal_release_flow.py -v

      - name: Build unsigned Windows internal release
        shell: pwsh
        run: npm run build:win:internal

      - name: Upload Windows internal evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-release-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            docs/desktop/evidence/internal-release.json
            docs/desktop/evidence/internal-release.md
            desktop/release/internal/windows/**
